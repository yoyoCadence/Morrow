# Runs the same checks a contributor runs locally (AGENTS.md §0) on every pull
# request and on main. No secrets are used or needed: tests never contact a
# real provider, and the database is a throwaway service container.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, build, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: morrow
          POSTGRES_DB: morrow_test
          # Disposable container reachable only from this job, so no password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morrow -d morrow_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # The test suite refuses any database whose name does not end in _test.
      MORROW_TEST_DATABASE_URL: postgres://morrow@127.0.0.1:5432/morrow_test
    steps:
      # Third-party actions are pinned to a commit, like the lockfile pins packages.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install (lockfile only, no install scripts)
        run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # The dashboard smoke test drives a real browser. Playwright downloads the
      # Chromium build that matches its pinned version; --with-deps installs the
      # system libraries it needs through apt.
      - name: Install Chromium for the dashboard smoke test
        run: npx playwright install --with-deps --only-shell chromium
      - name: Dashboard smoke test
        run: npm run test:e2e
      - name: Migration smoke check
        env:
          MORROW_DATABASE_URL: postgres://morrow@127.0.0.1:5432/morrow_test
        run: |
          npm run migrate
          npm run migrate | tee second-run.txt
          grep -q "Database is up to date" second-run.txt
